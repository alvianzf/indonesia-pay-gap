<body>
  <noscript>
    <p style="max-width:640px;margin:40px auto;font-family:sans-serif;padding:0 20px">
      This page needs JavaScript enabled. It shows an interactive map, datatables, and analytics of
      Indonesia's 2026 minimum wages (UMP/UMK) across all 38 provinces and 517 kabupaten/kota, including
      a pay-gap comparison against average wages.
    </p>
  </noscript>
  <header class="topbar">
    <canvas id="matrix-rain" aria-hidden="true"></canvas>

    </div>

  <main id="app">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <div>Loading wage &amp; map data…</div>
    </div>
  </main>
  <footer class="site-footer">
    UMK/UMP 2026 and BPS Sakernas average-wage data, merged with public GeoJSON administrative boundaries (BIG). See methodology on the home page for data-coverage caveats.
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
  <script type="module" src="js/main.js"></script>
  <script>
    (function () {
      var canvas = document.getElementById('matrix-rain');
      if (!canvas || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var ctx = canvas.getContext('2d');
      var glyphs = 'アイウエオカキクケコサシスセソ01234567890<>/[]{}=+-';
      var fontSize = 15;
      var columns = 0, drops = [];

      function resize() {
        var rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        columns = Math.floor(canvas.width / fontSize);
        drops = new Array(columns).fill(0).map(function () { return Math.random() * -40; });
      }
      window.addEventListener('resize', resize);
      resize();

      function tick() {
        ctx.fillStyle = 'rgba(3, 8, 5, 0.18)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + 'px Rajdhani, sans-serif';
        for (var i = 0; i < columns; i++) {
          var text = glyphs[Math.floor(Math.random() * glyphs.length)];
          var y = drops[i] * fontSize;
          ctx.fillStyle = y < fontSize * 2 ? 'rgba(180,255,210,0.85)' : 'rgba(0,255,120,0.35)';
          ctx.fillText(text, i * fontSize, y);
          if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        }
      }
      setInterval(tick, 60);
    })();
  </script>
</body>
